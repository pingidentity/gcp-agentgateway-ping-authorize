# Cloud Build pipeline: ping-authz-shim
#
# Deploys the ext_proc authorization shim. The load balancer calls this service
# via gRPC on every inbound request. It consults PingAuthorize to decide
# whether to allow or deny the request before it reaches the MCP server.
#
# Pipeline: Build image → Push to Artifact Registry → Deploy to Cloud Run
#
# Security: Ingress restricted to load balancer traffic only — services are
# not directly accessible from the public internet.

substitutions:
  _GCP_REGION: us-central1
  _GCP_PROJECT_ID: tech-partner-ping
  _PING_AUTHZ_SHIM_REPO: ping-authz-shim-repo
  _SERVICE_NAME: ping-authz-shim
  _PING_AUTHORIZE_URL: https://34.41.151.105:7443/governance-engine
  _MCP_SERVER_URL: https://ping-gcp-agent-gateway.com
  _SKIP_TLS_VERIFY: "true"
  _OAUTH_SCOPES: "openid profile email stripe_mcp:invoke"

steps:
  # Build the Docker image.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_PING_AUTHZ_SHIM_REPO}/ping-authz-shim:${SHORT_SHA}
      - ping-authz-shim

  # Push the image to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_PING_AUTHZ_SHIM_REPO}/ping-authz-shim:${SHORT_SHA}

  # Deploy to Cloud Run.
  # --ingress: only reachable via the load balancer, not the public internet.
  # --use-http2: required for gRPC (ext_proc protocol runs over HTTP/2).
  # --set-env-vars: PingAuthorize endpoint, gateway URL, TLS config, and scopes.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_GCP_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_PING_AUTHZ_SHIM_REPO}/ping-authz-shim:${SHORT_SHA}
      - --region
      - ${_GCP_REGION}
      - --platform
      - managed
      - --ingress
      - internal-and-cloud-load-balancing
      - --allow-unauthenticated
      - --use-http2
      - --set-env-vars
      - PING_AUTHORIZE_URL=${_PING_AUTHORIZE_URL},MCP_SERVER_URL=${_MCP_SERVER_URL},SKIP_TLS_VERIFY=${_SKIP_TLS_VERIFY},OAUTH_SCOPES=${_OAUTH_SCOPES}

options:
  logging: CLOUD_LOGGING_ONLY
